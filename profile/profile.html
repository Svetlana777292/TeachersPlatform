<!DOCTYPE html>
<html lang="ru">
<head>
    <title>Профиль</title>
    <link rel="stylesheet" href="./profile.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<div id="overlay" class=""></div>
<div id='loadingScreen' class="loading">
    <div class="gear-wrapper">
        <img class="gear" src="/images/gear.svg" alt="Загрузка">
    </div>
    <h2>Загружаем ваш профиль...</h2>
</div>
<!--Шапка-->
<header class="main-header">
    <h1 class="page-title">Профиль</h1>
    <button id="burgerBtn" type="button" class="burger-btn">
        <svg id="menuIcon" class="burger-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 6H20M4 12H20M4 18H20" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </button>

    <nav class="menu">
        <ul id="menuList" class="menu-list">
            <li class="link"><a href="/finance/finance.html">Финансы</a></li>
            <li class="link"><a href=".">Расписание</a></li>
            <li class="link target-link">Профиль</li>
        </ul>
    </nav>
</header>
<div class="main-container">
    <aside class="user-info">

        <!--Аватарка-->
        <div class="avatar-wrapper">
            <input type="file" id="avatarArea" class="avatar-input" accept="image/*">
            <img id="avatarImg" src="/images/avatar.png" alt="" class="avatar-img">
        </div>

        <!--Полное имя и роль-->
        <h1 id="fullName" class="main-title">Иван Иванов</h1>
        <h3 id="user-role" class="role"></h3>

        <!--Кнопка для редактирования аватарки-->
        <button id="editProfileBtn" class="btn edit-avatar-btn">Редактировать фото</button>

        <!--Информация о пользователе-->
        <dl class="account-info">
            <dt>Дата регистрации</dt>
            <dd id="registrationDate">02.03.2025</dd>
            <dt>Учеников за все время</dt>
            <dd>0</dd>
        </dl>
    </aside>
    <main class="edit-account-info">
        <div class ="edit-info-title">
            <h2 class="account-info-title">Информация о профиле</h2>
            <!--Кнопка для активации формы редактирования профиля-->
            <button type="button" id="editInfoBtn" class="btn edit-profile-btn" >Изменить профиль</button>
        </div>

        <!--Редактировать профиль-->
        <form id="editInfoForm" class="edit-profile">

            <div class="fullname-container">
                <!--Изменить имя-->
                <div class="form-group">
                    <label for="change-name">Имя</label>
                    <input name="name" id="change-name" placeholder="Иван" value="" type="text" class="info-areas" disabled>
                </div>

                <!--Изменить фамилию-->
                <div class="form-group">
                    <label for="change-surname">Фамилия</label>
                    <input name="surname" id="change-surname" placeholder="Иванов" value="" type="text" class="info-areas" disabled>
                </div>
            </div>

            <!--Изменить электронный адрес-->
            <div class="form-group">
                <label for="change-email">Электронная почта</label>
                <input name="email" id="change-email" placeholder="ivan.ivanov@example.com" value="" type="email" class="info-areas" disabled>
            </div>

            <!--Добавить номер телефона-->
            <div class="form-group">
                <label for="change-phone">Номер телефона</label>
                <input name="phoneNumber" id="change-phone" placeholder="+1 (11) 111-11-11" value="" type="text" class="info-areas" disabled>
            </div>

            <!--Добавить перечень предметов-->
            <div class="form-group">
                <label for="subjects">Предметы</label>
                <input name="discipline" id="subjects" placeholder="Математика, физика" value="" type="text" class="info-areas" disabled>
            </div>

            <!--Добавить биографию-->
            <div class="form-group">
                <label for="bio">О себе</label>
                <textarea name="description" id="bio" placeholder="" maxlength="200" class="info-areas" disabled></textarea>
            </div>
        </form>
    </main>
    <div class="action-btns-container">
        <h3 class="action-title">Управление аккаунтом</h3>
        <!--Кнопка для смены пароля-->
        <button type="button" id="changePasswordBtn" class="btn exit-btn" value="disabled">Сменить пароль</button>
        <!--Кнопка для выхода из профиля-->
        <button type="submit" id="exitBtn" class="btn exit-btn">Выйти из профиля</button>
        <!--Кнопка для удаления профиля-->
        <button id="deleteProfileBtn" type="button" class="btn delete-btn">Удалить профиль</button>
    </div>

    <section id="changePasswordWindow" class="change-password">
        <h2 class="change-password-title">Смена пароля</h2>
        <div class="form-group">
            <label for="newPassword">Новый пароль</label>
            <input name="newPassword" id="newPassword" value="" type="password" class="info-areas">
        </div>
        <div class="form-group">
            <label for="newPasswordRepeat">Подтвердите новый пароль</label>
            <input name="newPasswordRepeat" id="newPasswordRepeat" value="" type="password" class="info-areas">
        </div>
        <div id="passwordErrorField"></div>
        <div id="cancelChangingPasswordBtn" class="password-btns">
            <button id="cancelBtn" class="btn">Отмена</button>
            <button id="confirmPasswordBtn" class="confirm-changes-btn btn" type="submit">Сменить пароль</button>
        </div>
    </section>
</div>

<footer class="footer">
</footer>
</body>
<script src="../config.js"></script>
<script src="/profile/profile.js"></script>
</html>
